name: first_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # UI & Images
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

  # Maps & Location
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0
  location: ^7.0.0
  geolocator: ^13.0.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Charts & Calendar
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Internationalization
  intl: ^0.19.0

  # Utilities
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/google_logo.png
    - assets/background.jpg
    - assets/icon.png
    - assets/map_bg.jpg
    - assets/images/
  uses-material-design: true